spring:
  application:
    name: radoTripApi
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/radotrip?useSSL=false&serverTimezone=Asia/Seoul&characterEncoding=UTF-8
    username: your_mysql_username
    password: your_mysql_password
# MyBatis 설정
mybatis:
  # XML 매퍼 파일들의 위치 지정 (resources/mappers 폴더 하위의 모든 xml 파일)
  mapper-locations: classpath:mappers/**/*.xml
  # XML에서 자바 객체 타입을 짧게 쓰기 위한 기본 패키지 지정 (선택)
  type-aliases-package: com.api.radotrip.dto
  # 카멜케이스 자동 매핑 (DB의 snake_case 컬럼명을 자바의 camelCase 필드명으로 매핑)
  configuration:
    map-underscore-to-camel-case: true